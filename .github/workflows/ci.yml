name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Smoke test — import all modules
        run: |
          python -c "
          import nimcode.cli
          import nimcode.config
          import nimcode.context
          import nimcode.skills
          import nimcode.core.agent
          import nimcode.core.agent_tui
          import nimcode.core.prompts
          import nimcode.core.state
          import nimcode.tools
          import nimcode.tools.base
          import nimcode.ui.console
          import nimcode.ui.output
          import nimcode.ui.rust_bridge
          print('All modules imported successfully.')
          "

      - name: Smoke test — CLI entry point
        run: nimcode status
        env:
          NVIDIA_API_KEY: "dummy-key-for-ci"

      - name: Verify Docker sandbox availability
        run: |
          python -c "
          from nimcode.tools.base import is_docker_available
          if is_docker_available():
              print('Docker sandbox: OK')
          else:
              print('WARNING: Docker unavailable, host-execution fallback will be used')
          "

      - name: Run test suite
        run: pytest -v
        env:
          NVIDIA_API_KEY: "dummy-key-for-ci"

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tui-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # reads ../tests/protocol_samples.json (shared with test_bridge_protocol.py)
      - run: cargo test

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sidecar and bundle it
        run: |
          cargo build --release --manifest-path tui-rs/Cargo.toml
          cp tui-rs/target/release/nim-tui src/nimcode/bin/
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist
      - name: Check wheel bundles the sidecar
        run: |
          python -c "
          import glob, zipfile
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          assert 'nimcode/bin/nim-tui' in names, names
          print(whl, 'contains nimcode/bin/nim-tui')
          "
