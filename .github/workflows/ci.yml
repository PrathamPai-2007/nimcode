name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e .

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Smoke test — import all modules
        run: |
          python -c "
          import nimcode.cli
          import nimcode.config
          import nimcode.context
          import nimcode.skills
          import nimcode.core.agent
          import nimcode.core.prompts
          import nimcode.core.state
          import nimcode.tools
          import nimcode.ui.tui
          import nimcode.ui.console
          print('All modules imported successfully.')
          "

      - name: Smoke test — CLI entry point
        run: nimcode status
        env:
          NVIDIA_API_KEY: "dummy-key-for-ci"
