[package]
name = "nim-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync", "net"] }
pulldown-cmark = "0.12"
textwrap = "0.16"
unicode-width = "0.1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
