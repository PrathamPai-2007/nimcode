[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimcode"
dynamic = ["version"]
description = "Terminal-first AI coding agent driven by NVIDIA NIM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "playwright>=1.40.0",
    'colorama>=0.4.6; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = ["ruff==0.15.15", "pytest==8.4.2", "httpx", "build", "wheel"]

[project.scripts]
nimcode = "nimcode.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "nimcode.__version__"}

[tool.setuptools.package-data]
nimcode = ["bin/*"]
