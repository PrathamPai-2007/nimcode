[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimcode"
version = "0.4.0"
description = "Terminal-first AI coding agent driven by NVIDIA NIM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
nimcode = "nimcode.cli:app"
